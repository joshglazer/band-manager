<svg xmlns="http://www.w3.org/2000/svg" width="200" height="80" viewBox="0 0 200 80">
  <!-- Background for preview context -->
  <rect width="200" height="80" fill="#0d0507"/>

  <!-- === LOGO MARK === -->
  <!-- Guitar pick shape: rounded top, converges to a point at bottom -->
  <path d="M40 8 C29 8 20 16 20 28 C20 42 40 62 40 62 C40 62 60 42 60 28 C60 16 51 8 40 8 Z"
        fill="#b91c1c"/>

  <!-- Subtle top-edge highlight for depth -->
  <path d="M40 10 C30 10 22 17 22 28 C22 17.5 30 10.5 40 10 Z"
        fill="white" opacity="0.12"/>

  <!-- Three white staff lines through the middle of the pick -->
  <line x1="27" y1="26" x2="53" y2="26" stroke="white" stroke-width="1.6" stroke-linecap="round" opacity="0.65"/>
  <line x1="27" y1="31" x2="53" y2="31" stroke="white" stroke-width="1.6" stroke-linecap="round" opacity="0.65"/>
  <line x1="27" y1="36" x2="53" y2="36" stroke="white" stroke-width="1.6" stroke-linecap="round" opacity="0.65"/>

  <!-- Filled quarter-note head, sitting on the middle staff line -->
  <ellipse cx="38" cy="31.5" rx="3.8" ry="3" transform="rotate(-20 38 31.5)" fill="white"/>

  <!-- Note stem going upward from note head -->
  <line x1="41.5" y1="30" x2="41.5" y2="19" stroke="white" stroke-width="2" stroke-linecap="round"/>

  <!-- === WORDMARK === -->
  <text x="72" y="34"
        font-family="'Geist Sans', 'Inter', system-ui, sans-serif"
        font-size="17"
        font-weight="700"
        letter-spacing="-0.4"
        fill="white">Band</text>
  <text x="72" y="52"
        font-family="'Geist Sans', 'Inter', system-ui, sans-serif"
        font-size="13"
        font-weight="500"
        letter-spacing="2.5"
        fill="#f87171"
        text-anchor="start">MANAGER</text>

  <!-- Thin separator line between icon and wordmark -->
  <line x1="65" y1="20" x2="65" y2="60" stroke="#b91c1c" stroke-width="1" opacity="0.5"/>
</svg>
