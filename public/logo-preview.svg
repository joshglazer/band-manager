<svg xmlns="http://www.w3.org/2000/svg" width="220" height="90" viewBox="0 0 220 90">
  <!-- Background -->
  <rect width="220" height="90" fill="#0d0507"/>

  <!-- Antenna -->
  <line x1="40" y1="9" x2="40" y2="16" stroke="#f87171" stroke-width="2" stroke-linecap="round"/>
  <circle cx="40" cy="7" r="3" fill="#f87171"/>

  <!-- Head -->
  <rect x="25" y="16" width="30" height="20" rx="5" fill="#b91c1c"/>

  <!-- Left eye -->
  <circle cx="33" cy="25" r="4" fill="white"/>
  <circle cx="34" cy="25.5" r="2" fill="#1a0505"/>
  <circle cx="32" cy="23.5" r="1" fill="white"/>

  <!-- Right eye -->
  <circle cx="47" cy="25" r="4" fill="white"/>
  <circle cx="48" cy="25.5" r="2" fill="#1a0505"/>
  <circle cx="46" cy="23.5" r="1" fill="white"/>

  <!-- Mouth (pixel grin) -->
  <rect x="33" y="32" width="14" height="2.5" rx="1.2" fill="white" opacity="0.8"/>

  <!-- Neck -->
  <rect x="36" y="36" width="8" height="5" rx="2" fill="#991b1b"/>

  <!-- Body -->
  <rect x="20" y="41" width="40" height="28" rx="7" fill="#b91c1c"/>

  <!-- Music note on chest -->
  <ellipse cx="37" cy="57" rx="3.5" ry="2.8" transform="rotate(-20 37 57)" fill="white" opacity="0.9"/>
  <line x1="40.2" y1="55.5" x2="40.2" y2="47" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M40.2 47 C44.5 48.5 44 52 41.5 53.5" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Left arm -->
  <rect x="9" y="44" width="11" height="7" rx="3.5" fill="#991b1b"/>

  <!-- Right arm -->
  <rect x="60" y="44" width="11" height="7" rx="3.5" fill="#991b1b"/>

  <!-- Left leg -->
  <rect x="26" y="69" width="12" height="13" rx="4" fill="#991b1b"/>
  <!-- Left foot -->
  <rect x="24" y="79" width="15" height="5" rx="2.5" fill="#7f1d1d"/>

  <!-- Right leg -->
  <rect x="42" y="69" width="12" height="13" rx="4" fill="#991b1b"/>
  <!-- Right foot -->
  <rect x="40" y="79" width="15" height="5" rx="2.5" fill="#7f1d1d"/>

  <!-- Divider -->
  <line x1="84" y1="18" x2="84" y2="72" stroke="#b91c1c" stroke-width="1" opacity="0.5"/>

  <!-- Wordmark -->
  <text x="96" y="42"
        font-family="'Geist Sans', 'Inter', system-ui, sans-serif"
        font-size="18" font-weight="700" letter-spacing="-0.4"
        fill="white">Band</text>
  <text x="96" y="60"
        font-family="'Geist Sans', 'Inter', system-ui, sans-serif"
        font-size="13" font-weight="500" letter-spacing="2.5"
        fill="#f87171">MANAGER</text>
</svg>
